site_name: Hermes Production Patterns
site_description: 面向 Hermes Agent 的生产级工程模式集 — 每条模式都在真实 7x24 环境验证过
site_url: https://komagon.github.io/hermes-production-patterns/
repo_url: https://github.com/Komagon/hermes-production-patterns
repo_name: Komagon/hermes-production-patterns
edit_uri: edit/main/

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: logo.png
  features:
    - navigation.sections        # 分组平铺，不用折叠
    - navigation.top             # 返回顶部
    - navigation.indexes         # 目录页可用
    - toc.follow
    - search.suggest
    - search.share
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: 切换主题
  font: false   # V2: 零外部请求(§39),用系统字体栈+显式 CJK 回退

extra_css:
  - assets/hpp.css
extra_javascript:
  - assets/hpp.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      # 中文搜索(官方方案):构建期 search 插件检测到 jieba 即自动分词,词间插
      # 零宽空格;separator 必须含 \u200b。lang 不加 zh——社区版 lunr.zh 依赖
      # 浏览器端分词器,加载失败会让整个查询管线静默返回空(实测)。
      # CI 与本地都必须装 jieba,否则中文整词查询静默 0 结果。
      lang:
        - en
      separator: '[\s\u200b\-、，。！？；：（）()\/]+'

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Komagon/hermes-production-patterns
  generator: false

