name: docs-ci

on:
  push:
    branches: [main, feat/*, codex/*]
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run markdownlint
        run: npx markdownlint-cli2 '**/*.md' '#node_modules' '#.git'

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check external links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".mlc-config.json"
          max-depth: 2

  example-smoke:
    name: Example Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run example smoke tests
        run: |
          shopt -s nullglob
          for dir in examples/*/; do
            if [ -f "$dir/test_example.py" ]; then
              echo "--- Testing: $dir ---"
              python "$dir/test_example.py"
            fi
          done

  hpp-cli-smoke:
    name: hpp CLI Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: doctor
        run: cli/hpp doctor || true  # hermes/git 缺失不阻断,只报状态

      - name: init + validate + audit roundtrip
        run: |
          set -e
          cli/hpp init basic-agent /tmp/smoke-agent
          cli/hpp validate /tmp/smoke-agent
          cli/hpp audit /tmp/smoke-agent
          cli/hpp add maker-checker /tmp/smoke-agent
          cli/hpp audit /tmp/smoke-agent

      - name: starter-kits contract (6 kits, each with README)
        shell: python
        run: |
          from pathlib import Path
          root = Path("starter-kits")
          kits = sorted(p.name for p in root.iterdir() if p.is_dir())
          expected = ["basic-agent", "cron-production", "maker-checker",
                      "memory-agent", "research-agent", "self-evolving-agent"]
          assert kits == expected, f"kits mismatch: {kits}"
          for k in kits:
            assert (root / k / "README.md").exists(), f"{k} missing README"
            assert "Patterns Used" in (root / k / "README.md").read_text(), \
                f"{k} missing Patterns Used table"
          print(f"PASS: {len(kits)} starter kits OK")

  test-suite-schema:
    name: Test Suite Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate test-prompts.json schema
        run: python scripts/check_test_suite.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: TEST_REPORT.md

  state-contract:
    name: STATE Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate every shipped STATE.md against the schema
        run: |
          set -e
          for f in templates/STATE.md.template examples/*/STATE.md starter-kits/*/STATE.md; do
            [ -f "$f" ] || continue
            echo "--- $f"
            python scripts/validate_state.py "$f"
          done

  bilingual-check:
    name: Bilingual Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check README section count sync
        run: bash scripts/check-bilingual.sh

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements-dev.txt

      - name: Set up Node.js (lint.js contract tests)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The Windows console code page is not UTF-8, and that is the environment
      # users actually run in. Pinning it here keeps the suite honest: a child
      # process that prints Chinese through the console encoding fails loudly
      # instead of passing on a machine that happens to have a CJK code page.
      #
      # Failures are re-emitted as annotations because a job log needs
      # authentication to read and an annotation does not.
      - name: Run pytest with coverage
        shell: bash
        env:
          PYTHONIOENCODING: ${{ runner.os == 'Windows' && 'cp1252' || 'utf-8' }}
        run: |
          set +e
          python -m pytest --cov --cov-report=term-missing -q --tb=line 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest.log | head -8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- tail of pytest.log ---"
            tail -n 30 pytest.log
          fi
          exit "$code"

  repo-lint:
    name: Convention Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Lint skills and conventions
        run: node scripts/lint.js

  docs-consistency:
    name: Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version check compares package.json against git tags, which a
          # depth-1 clone does not have.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check claimed counts, version and frontmatter
        run: python scripts/check_docs_consistency.py
